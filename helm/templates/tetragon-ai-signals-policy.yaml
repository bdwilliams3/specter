{{- if .Values.tetragon.aiSignalsPolicy.enabled }}
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: specter-ai-signals
spec:
  kprobes:
    # DNS egress observation, adapted from Tetragon's upstream ip_output DNS
    # example. This hook is stable in KIND and gives pod/process attribution
    # for UDP/53 packets without relying on syscall symbol names.
    - call: "ip_output"
      syscall: false
      args:
        - index: 2
          type: "skb"
      selectors:
        - matchArgs:
            - index: 2
              operator: "Protocol"
              values:
                - "IPPROTO_UDP"
            - index: 2
              operator: "DPort"
              values:
                - "53"
          matchActions:
            - action: Post
    # tcp_sendmsg payload-capture hook removed under SCRUM-55. The hook fired
    # on every TCP send in every container with maxData: true, burning ~270%
    # CPU on the KIND control-plane container, and on this Docker Desktop
    # kernel the iov_iter walk returns empty payload bytes — so SNI extraction
    # produced no usable signal anyway. Reintroduce SNI capture via
    # security_socket_sendmsg (LSM, stable signature) under the SCRUM-54
    # plan-of-action Step 2, with maxData <= 512, dport=443, workload-only ns.
{{- end }}
