{{- if .Values.tetragon.aiSignalsPolicy.enabled }}
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: specter-ai-signals
spec:
  kprobes:
    # Capture outbound stream payloads on the stable kernel TCP helper.
    # Avoid syscall entry probes here: syscall/helper names vary across kernels
    # and a single invalid hook prevents the entire TracingPolicy from loading.
    - call: "tcp_sendmsg"
      syscall: false
      args:
        - index: 0
          type: "sock"
        - index: 1
          type: "iov_iter"
          sizeArgIndex: 2
          maxData: true
        - index: 2
          type: "size_t"
      selectors:
        - matchArgs:
            - index: 2
              operator: GreaterThan
              values:
                - "32"
          matchActions:
            - action: Post
{{- end }}
