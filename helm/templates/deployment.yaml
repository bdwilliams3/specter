apiVersion: apps/v1
kind: Deployment
metadata:
  name: specter
  namespace: specter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: specter
  template:
    metadata:
      labels:
        app: specter
    spec:
      serviceAccountName: specter
      containers:
        - name: specter
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: specter-config
            - secretRef:
                name: specter-secrets
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: specter-data
        {{- end }}
