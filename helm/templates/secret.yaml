apiVersion: v1
kind: Secret
metadata:
  name: specter-secrets
  namespace: specter
type: Opaque
stringData:
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  OIDC_REDIRECT_URI: {{ .Values.oidc.redirectUri | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.scanners.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.scanners.aws.secretAccessKey | quote }}
  GCP_PROJECT_ID: {{ .Values.scanners.gcp.projectId | quote }}
  AZURE_SUBSCRIPTION_ID: {{ .Values.scanners.azure.subscriptionId | quote }}
  AZURE_TENANT_ID: {{ .Values.scanners.azure.tenantId | quote }}
  AZURE_CLIENT_ID: {{ .Values.scanners.azure.clientId | quote }}
  AZURE_CLIENT_SECRET: {{ .Values.scanners.azure.clientSecret | quote }}
  IBM_API_KEY: {{ .Values.scanners.ibm.apiKey | quote }}
  ALIBABA_ACCESS_KEY_ID: {{ .Values.scanners.alibaba.accessKeyId | quote }}
  ALIBABA_ACCESS_KEY_SECRET: {{ .Values.scanners.alibaba.accessKeySecret | quote }}
  SPLUNK_HEC_URL: {{ .Values.observability.splunk.hecUrl | quote }}
  SPLUNK_HEC_TOKEN: {{ .Values.observability.splunk.hecToken | quote }}
  CRIBL_URL: {{ .Values.observability.cribl.url | quote }}
  GRAFANA_URL: {{ .Values.observability.grafana.url | quote }}
  GRAFANA_API_KEY: {{ .Values.observability.grafana.apiKey | quote }}
