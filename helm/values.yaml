image:
  repository: specter
  tag: latest
  pullPolicy: Never

service:
  nodePort: 30001
  port: 9000

mcp:
  serverUrl: "http://mcp-server.workload.svc.cluster.local:8000/mcp"

database:
  type: sqlite
  sqlitePath: /data/specter.db

persistence:
  enabled: true
  size: 1Gi
  storageClass: standard

oidc:
  enabled: false
  issuer: ""
  clientId: ""
  clientSecret: ""
  redirectUri: "http://localhost:9000/auth/callback"

scanners:
  k8s:
    enabled: true
  aws:
    enabled: false
    region: us-east-1
    accessKeyId: ""
    secretAccessKey: ""
  gcp:
    enabled: false
    projectId: ""
  azure:
    enabled: false
    subscriptionId: ""
    tenantId: ""
    clientId: ""
    clientSecret: ""
  ibm:
    enabled: false
    apiKey: ""
    region: us-south
  alibaba:
    enabled: false
    accessKeyId: ""
    accessKeySecret: ""
    regionId: cn-hangzhou

tetragon:
  aiSignalsPolicy:
    enabled: true
    excludedNamespaces:
      - kube-system
      - specter
    providerHosts:
      - api.openai.com
      - api.anthropic.com
      - generativelanguage.googleapis.com
      - api.cohere.ai
      - inference.ai.azure.com

# Principals Specter will NOT flag on mutation-class rules.
# fnmatch glob patterns against audit event user.username.
# Raw `terraform apply` authenticates as its kubeconfig user — if your pipeline
# uses a dedicated SA or service user, add it here.
trustedInstallers:
  # Bootstrap / cluster admin
  - "kubernetes-admin"

  # GitOps
  - "system:serviceaccount:argocd:*"
  - "system:serviceaccount:flux-system:*"

  # Tekton (k8s-native CI)
  - "system:serviceaccount:tekton-pipelines:*"

  # Jenkins (in-cluster)
  - "system:serviceaccount:jenkins:*"
  - "system:serviceaccount:cicd:jenkins*"

  # Harness delegate
  - "system:serviceaccount:harness-delegate:*"
  - "system:serviceaccount:harness-delegate-ng:*"

  # Red Hat / OpenShift Lightspeed + OpenShift pipelines
  - "system:serviceaccount:openshift-lightspeed:*"
  - "system:serviceaccount:openshift-operators:*"
  - "system:serviceaccount:openshift-gitops:*"
  - "system:serviceaccount:openshift-pipelines:*"

  # Terraform-shaped in-cluster operators (Crossplane, tf-controller)
  - "system:serviceaccount:upbound-system:*"
  - "system:serviceaccount:crossplane-system:*"
  - "system:serviceaccount:flux-system:tf-controller"

observability:
  splunk:
    enabled: false
    hecUrl: ""
    hecToken: ""
  cribl:
    enabled: false
    url: ""
  grafana:
    enabled: false
    url: ""
    apiKey: ""
